<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Comparar Transformadores</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body { font-family:'Segoe UI', sans-serif; max-width:900px; margin:40px auto; background: #f7f7f7; padding:30px; border-radius:10px; }
    h1{text-align:center;color:#2c3e50;}
    label{display:block;margin-top:20px;font-weight:600;}
    input,button{padding:10px;width:100%;margin-top:8px;border-radius:5px;border:1px solid #bbb;}
    button{background:#2980b9;color:#fff;cursor:pointer;font-weight:bold;}
    button:hover{background:#3498db;}
    #resultado{margin-top:30px;padding:20px;background:#fff;border:2px solid #ccc;border-radius:8px;overflow-x:auto;}
    .transformador-dados{margin-bottom:20px;padding:15px;background:#ecf0f1;border-radius:6px;}
    .transformador-dados h3{margin-top:0;color:#2980b9;}
    table{width:100%;border-collapse:collapse;margin-top:20px;}
    th,td{padding:10px;border-bottom:1px solid #ccc;text-align:center;}
    th{background:#2980b9;color:white;}
    .diff-positive{color:green;font-weight:bold;}
    .diff-negative{color:red;font-weight:bold;}
    .diff-neutral{color:gray;}
  </style>
</head>
<body>

<h1>Comparação de Transformadores</h1>

<label>Subprojeto/Transformador 1:</label>
<input type="text" id="nome1" placeholder="Insere o primeiro subprojeto">

<label>Subprojeto/Transformador 2:</label>
<input type="text" id="nome2" placeholder="Insere o segundo subprojeto">

<button id="btnComparar">Comparar</button>

<div id="resultado">Introduz os nomes dos transformadores e clica "Comparar".</div>

<canvas id="graficoTaxas1" style="max-width:100%;margin-top:40px;"></canvas>
<canvas id="graficoTaxas2" style="max-width:100%;margin-top:40px;"></canvas>
<button id="btnExportarPDF" style="display:none;margin-top:15px;">Exportar PDF</button>

<script>
// -------------------- Funções auxiliares --------------------
function parseNum(v){ 
  const n=parseFloat((v||'').toString().replace(',','.').trim()); 
  return isNaN(n)?NaN:n; 
}

// -------------------- API --------------------
async function buscarDados(subprojeto){
  try{
    const resp = await fetch(`/api/transformador?nome=${encodeURIComponent(subprojeto)}`);
    if(!resp.ok) throw new Error("Transformador não encontrado");
    const data = await resp.json();
    return Array.isArray(data)?data:null;
  }catch(err){ 
    console.error(err); 
    return null; 
  }
}

// -------------------- Cálculos --------------------
function getSerie(dados){ 
  return (dados.serie||[])
    .map(r => ({ ts: new Date(r.DataHora.replace(' ','T')).getTime(), lc: parseNum(r.LC_3_8) }))
    .filter(r => !isNaN(r.ts) && !isNaN(r.lc)) // 0 é válido
    .sort((a, b) => a.ts - b.ts);
}

function calcTaxa(id, massaKg, dados){
  const serie = getSerie(dados);
  if(serie.length === 0) return null;

  const ton = parseNum(massaKg)/1000 || 1; // kg -> toneladas
  const primeiro = serie[0];
  const ultimo = serie[serie.length - 1];

  const deltaTotal = serie.length > 1 ? +(ultimo.lc - primeiro.lc).toFixed(3) : 0;
  const duracao = serie.length > 1 ? (ultimo.ts - primeiro.ts) / 3600000 : 1;
  const taxaTotal = +(deltaTotal / (duracao * ton)).toFixed(4);

  const alvo = ultimo.ts - 10*3600*1000;
  const anterior10h = serie.find(r => r.ts <= alvo) || primeiro;
  const delta10h = +(ultimo.lc - anterior10h.lc).toFixed(3);
  const taxa10h = +(delta10h / (10 * ton)).toFixed(4);

  return { delta10h, taxa10h, deltaTotal, taxaTotal, duracao };
}

function calcTaxaPorHoraTodoPeriodo(dados,massaKg){
  const serie = getSerie(dados);
  if(serie.length<1) return [];
  const ton=parseNum(massaKg)/1000||1;
  const blocos=[];
  const tIniGlobal=serie[0].ts;
  const tFimGlobal=serie[serie.length-1].ts;
  const horas=Math.floor((tFimGlobal-tIniGlobal)/(3600*1000));
  for(let i=1;i<=horas;i++){
    const tIni=tIniGlobal+(i-1)*3600*1000;
    const tFim=tIniGlobal+i*3600*1000;
    const anterior=serie.find(r=>r.ts<=tIni);
    const atual=serie.find(r=>r.ts<=tFim);
    const horaLabel=new Date(tFim).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    if(anterior && atual && atual.ts>anterior.ts){
      const delta=+(atual.lc-anterior.lc).toFixed(3);
      const taxa=+(delta/ton).toFixed(4);
      blocos.push({intervalo:horaLabel,delta,taxa});
    } else { 
      blocos.push({intervalo:horaLabel,delta:'N/A',taxa:'N/A'}); 
    }
  }
  return blocos;
}

function maxTEfromSerie(dados){
  const colunas=['TE_5_4_1','TE_5_4_2','TE_5_4_3','TE_5_4_4','TE_5_4_5','TE_5_4_6'];
  const valores=[];
  (dados.serie||[]).forEach(linha=>{
    colunas.forEach(col=>{
      const val=parseNum(linha[col]);
      if(!isNaN(val)&&val>=0&&val<=140) valores.push(val);
    });
  });
  return valores.length>0?Math.max(...valores):null;
}

function minPE(dados,coluna){ 
  const valores=(dados.serie||[]).map(r=>parseNum(r[coluna])).filter(v=>!isNaN(v)&&v>0.1);
  return valores.length?Math.min(...valores):null;
}

// -------------------- Comparar --------------------
document.getElementById('btnComparar').addEventListener('click', async () => {
  const nome1 = document.getElementById('nome1').value.trim();
  const nome2 = document.getElementById('nome2').value.trim();
  const out = document.getElementById('resultado');
  if (!nome1 || !nome2) { out.innerHTML = '<p>Introduz os dois subprojetos.</p>'; return; }

  console.log("Buscando dados para:", nome1, "e", nome2);

  const m1Array = await buscarDados(nome1);
  const m2Array = await buscarDados(nome2);

  console.log("Dados retornados do API:");
  console.log(nome1, m1Array);
  console.log(nome2, m2Array);

  if (!m1Array?.length || !m2Array?.length) { out.innerHTML = '<p>Transformador(es) não encontrado(s).</p>'; return; }

  const m1 = m1Array[0].meta || {};
  const m2 = m2Array[0].meta || {};

  console.log("Metadados extraídos:");
  console.log(nome1, m1);
  console.log(nome2, m2);

  if (!m1.massai || parseNum(m1.massai) <= 0 || !m2.massai || parseNum(m2.massai) <= 0) {
    out.innerHTML = '<p>Massa de isolantes inválida para um dos transformadores.</p>';
    console.log("Massa inválida detectada:", m1.massai, m2.massai);
    return;
  }

  const t1 = calcTaxa(m1.id_secagenscore, m1.massai, m1);
  const t2 = calcTaxa(m2.id_secagenscore, m2.massai, m2);

  console.log("Cálculos de taxa:");
  console.log(nome1, t1);
  console.log(nome2, t2);

  if (!t1 || !t2) { out.innerHTML = '<p>Erro ao calcular taxas.</p>'; return; }

  const te1 = maxTEfromSerie(m1);
  const te2 = maxTEfromSerie(m2);
  const pe1_417 = minPE(m1, 'PE_4_17');
  const pe2_417 = minPE(m2, 'PE_4_17');
  const pe1_551 = minPE(m1, 'PE_5_5_1');
  const pe2_551 = minPE(m2, 'PE_5_5_1');

  console.log("TE/PE valores:");
  console.log(nome1, { te1, pe1_417, pe1_551 });
  console.log(nome2, { te2, pe2_417, pe2_551 });

  const blocos1 = calcTaxaPorHoraTodoPeriodo(m1, m1.massai);
  const blocos2 = calcTaxaPorHoraTodoPeriodo(m2, m2.massai);

  console.log("Taxas por hora:");
  console.log(nome1, blocos1);
  console.log(nome2, blocos2);

  // O restante código de gráficos e HTML permanece igual...
});


  // --- gráficos ---
  const ctx1=document.getElementById("graficoTaxas1").getContext("2d");
  if(window.chartTaxas1) window.chartTaxas1.destroy();
  window.chartTaxas1=new Chart(ctx1,{
    type:'line',
    data:{
      labels:blocos1.map(b=>b.intervalo).reverse(),
      datasets:[{label:nome1,data:blocos1.map(b=>parseNum(b.taxa)),borderColor:'rgba(41,128,185,1)',backgroundColor:'rgba(41,128,185,0.2)'}]
    },
    options:{responsive:true,plugins:{legend:{display:true}}}
  });

  const ctx2=document.getElementById("graficoTaxas2").getContext("2d");
  if(window.chartTaxas2) window.chartTaxas2.destroy();
  window.chartTaxas2=new Chart(ctx2,{
    type:'line',
    data:{
      labels:blocos2.map(b=>b.intervalo).reverse(),
      datasets:[{label:nome2,data:blocos2.map(b=>parseNum(b.taxa)),borderColor:'rgba(231,76,60,1)',backgroundColor:'rgba(231,76,60,0.2)'}]
    },
    options:{responsive:true,plugins:{legend:{display:true}}}
  });

  // --- HTML resultado ---
  out.innerHTML=`
  <div class="transformador-dados">
    <h3>${nome1}</h3>
    <p>Delta 10h: ${t1.delta10h} | Taxa 10h: ${t1.taxa10h}</p>
    <p>Delta Total: ${t1.deltaTotal} | Taxa Total: ${t1.taxaTotal}</p>
    <p>Máx TE_5_4_X (≤140): ${te1??'N/A'}</p>
    <p>Mín PE_4_17: ${pe1_417??'N/A'} | Mín PE_5_5_1: ${pe1_551??'N/A'}</p>
  </div>
  <div class="transformador-dados">
    <h3>${nome2}</h3>
    <p>Delta 10h: ${t2.delta10h} | Taxa 10h: ${t2.taxa10h}</p>
    <p>Delta Total: ${t2.deltaTotal} | Taxa Total: ${t2.taxaTotal}</p>
    <p>Máx TE_5_4_X (≤140): ${te2??'N/A'}</p>
    <p>Mín PE_4_17: ${pe2_417??'N/A'} | Mín PE_5_5_1: ${pe2_551??'N/A'}</p>
  </div>
  <h3>Comparação</h3>
  <table>
    <tr><th>Indicador</th><th>${nome1}</th><th>${nome2}</th></tr>
    <tr><td>Taxa Total</td><td>${t1.taxaTotal}</td><td>${t2.taxaTotal}</td></tr>
    <tr><td>Delta Total</td><td>${t1.deltaTotal}</td><td>${t2.deltaTotal}</td></tr>
    <tr><td>Máx TE_5_4_X</td><td>${te1??'N/A'}</td><td>${te2??'N/A'}</td></tr>
    <tr><td>Mín PE_4_17</td><td>${pe1_417??'N/A'}</td><td>${pe2_417??'N/A'}</td></tr>
    <tr><td>Mín PE_5_5_1</td><td>${pe1_551??'N/A'}</td><td>${pe2_551??'N/A'}</td></tr>
  </table>
  `;
  document.getElementById("btnExportarPDF").style.display='block';
});

// -------------------- Exportar PDF --------------------
document.getElementById("btnExportarPDF").addEventListener("click", async()=>{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','pt','a4');
  const div = document.getElementById("resultado");
  await html2canvas(div).then(canvas=>{
    const imgData=canvas.toDataURL("image/png");
    const pdfWidth=doc.internal.pageSize.getWidth();
    const pdfHeight=(canvas.height*pdfWidth)/canvas.width;
    doc.addImage(imgData,'PNG',0,0,pdfWidth,pdfHeight);
  });
  doc.save("comparacao_transformadores.pdf");
});
</script>

</body>
</html>
