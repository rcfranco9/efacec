<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>Comparar Transformadores</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    background: linear-gradient(to bottom right, #f7f7f7, #e1e1e1);
    padding: 30px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    border-radius: 10px;
  }
  h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
  label { display: block; margin-top: 20px; font-weight: 600; color: #34495e; }
  input, button { padding: 10px; width: 100%; margin-top: 8px; border-radius: 5px; border: 1px solid #bbb; font-size: 16px; }
  button { margin-top: 20px; background-color: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; }
  button:hover { background-color: #3498db; }
  #resultado { margin-top: 30px; padding: 20px; background: #fff; border: 2px solid #ccc; border-radius: 8px; overflow-x: auto; }
  .transformador-dados { display: inline-block; width: 48%; margin-bottom: 20px; padding: 15px; background: #ecf0f1; border-radius: 6px; vertical-align: top; }
  .transformador-dados h3 { margin-top: 0; color: #2980b9; text-align:center; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 650px; }
  th, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: center; }
  th { background: #2980b9; color: white; }
  .diff-positive { color: green; font-weight: bold; }
  .diff-negative { color: red; font-weight: bold; }
  .diff-neutral { color: gray; }
  canvas { margin-top: 40px; }
</style>
</head>
<body>

<h1>Comparação de Transformadores</h1>

<label>Subprojeto/Transformador 1:</label>
<input type="text" id="nome1">

<label>Subprojeto/Transformador 2:</label>
<input type="text" id="nome2">

<button id="btnComparar">Comparar</button>

<div id="resultado">Introduz os nomes dos transformadores e clica "Comparar".</div>

<canvas id="graficoTaxas1" style="max-width: 100%;"></canvas>
<canvas id="graficoTaxas2" style="max-width: 100%;"></canvas>
<button id="btnExportarPDF" style="display: none; margin-top: 15px;">Exportar PDF</button>

<script>
// -------------------- Funções auxiliares --------------------
function parseNum(v) {
  const n = parseFloat((v||'').toString().replace(',', '.').trim());
  return isNaN(n) ? NaN : n;
}

function diffClass(v1,v2){
  if(v1>v2) return 'diff-positive';
  if(v1<v2) return 'diff-negative';
  return 'diff-neutral';
}

// -------------------- API --------------------
async function buscarDados(subprojeto){
  try{
    const resp = await fetch(`/api/transformador?nome=${encodeURIComponent(subprojeto)}`);
    if(!resp.ok) throw new Error("Transformador não encontrado");
    const data = await resp.json();
    return data[0].meta; // pegar o primeiro registro
  } catch(err){
    console.error(err);
    return null;
  }
}

// -------------------- Cálculos --------------------
function getSerie(dados) {
  return (dados.serie || []).map(r => ({
    ts: new Date(r.DataHora.replace(' ','T')).getTime(),
    lc: parseNum(r.LC_3_8)
  })).filter(r=>!isNaN(r.ts)&&!isNaN(r.lc)).sort((a,b)=>a.ts-b.ts);
}

function calcTaxa(dados){
  const serie = getSerie(dados);
  if(serie.length<2) return null;
  const ton = parseNum(dados.massai)/1000 || 1;
  const ultimo = serie[serie.length-1];
  const anterior = serie[0];
  const deltaTotal = +(ultimo.lc - anterior.lc).toFixed(3);
  const duracao = (ultimo.ts - anterior.ts)/3600000;
  const taxaTotal = +(deltaTotal/(duracao*ton)).toFixed(4);
  return {deltaTotal,taxaTotal,duracao};
}

function maxTEfromSerie(dados){
  const colunas = ['TE_5_4_1','TE_5_4_2','TE_5_4_3','TE_5_4_4','TE_5_4_5','TE_5_4_6'];
  const valores = [];
  (dados.serie||[]).forEach(linha=>{
    colunas.forEach(col=>{
      const val = parseNum(linha[col]);
      if(!isNaN(val)&&val>0&&val<=140) valores.push(val);
    });
  });
  return valores.length>0 ? Math.max(...valores) : null;
}

function minPE(dados,col){
  const valores = (dados.serie||[]).map(r=>parseNum(r[col])).filter(v=>!isNaN(v)&&v>0.1);
  return valores.length ? Math.min(...valores) : null;
}

// -------------------- Comparar --------------------
document.getElementById('btnComparar').addEventListener('click', async ()=>{
  const nome1 = document.getElementById('nome1').value.trim();
  const nome2 = document.getElementById('nome2').value.trim();
  const out = document.getElementById('resultado');

  if(!nome1||!nome2){
    out.innerHTML='<p>Introduz os dois subprojetos.</p>';
    return;
  }

  const t1 = await buscarDados(nome1);
  const t2 = await buscarDados(nome2);

  if(!t1||!t2){
    out.innerHTML='<p>Transformador(es) não encontrado(s).</p>';
    return;
  }

  const taxa1 = calcTaxa(t1);
  const taxa2 = calcTaxa(t2);
  const te1 = maxTEfromSerie(t1);
  const te2 = maxTEfromSerie(t2);
  const pe1_417 = minPE(t1,'PE_4_17');
  const pe2_417 = minPE(t2,'PE_4_17');
  const pe1_551 = minPE(t1,'PE_5_5_1');
  const pe2_551 = minPE(t2,'PE_5_5_1');

  out.innerHTML = `
  <div class="transformador-dados">
    <h3>${t1.subprojecto||t1.id_secagenscore}</h3>
    <p>Delta Total: <span class="${diffClass(taxa1.deltaTotal,taxa2.deltaTotal)}">${taxa1.deltaTotal}</span></p>
    <p>Taxa Total: <span class="${diffClass(taxa1.taxaTotal,taxa2.taxaTotal)}">${taxa1.taxaTotal}</span></p>
    <p>Máx TE_5_4_X: <span class="${diffClass(te1,te2)}">${te1}</span></p>
    <p>Mín PE_4_17: <span class="${diffClass(pe1_417,pe2_417)}">${pe1_417}</span></p>
    <p>Mín PE_5_5_1: <span class="${diffClass(pe1_551,pe2_551)}">${pe1_551}</span></p>
  </div>
  <div class="transformador-dados">
    <h3>${t2.subprojecto||t2.id_secagenscore}</h3>
    <p>Delta Total: <span class="${diffClass(taxa2.deltaTotal,taxa1.deltaTotal)}">${taxa2.deltaTotal}</span></p>
    <p>Taxa Total: <span class="${diffClass(taxa2.taxaTotal,taxa1.taxaTotal)}">${taxa2.taxaTotal}</span></p>
    <p>Máx TE_5_4_X: <span class="${diffClass(te2,te1)}">${te2}</span></p>
    <p>Mín PE_4_17: <span class="${diffClass(pe2_417,pe1_417)}">${pe2_417}</span></p>
    <p>Mín PE_5_5_1: <span class="${diffClass(pe2_551,pe1_551)}">${pe2_551}</span></p>
  </div>
  `;

  document.getElementById("btnExportarPDF").style.display='block';
});

// -------------------- Exportar PDF --------------------
document.getElementById("btnExportarPDF").addEventListener("click", async ()=>{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','pt','a4');
  const div = document.getElementById("resultado");
  await html2canvas(div).then(canvas=>{
    const imgData = canvas.toDataURL("image/png");
    const pdfWidth = doc.internal.pageSize.getWidth();
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
  });
  doc.save("comparacao_transformadores.pdf");
});
</script>

</body>
</html>
