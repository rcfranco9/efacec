<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Comparação Parcial</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { margin-right: 10px; }
    input { margin-right: 20px; }
    #resultado { margin-top: 20px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Comparação Parcial</h1>

  <div>
    <label>Potência:</label>
    <input type="text" id="filtroPotencia" placeholder="ex: 40000">

    <label>Tensão:</label>
    <input type="text" id="filtroTensao" placeholder="ex: 150">

    <button onclick="buscarTransformadores()">Pesquisar</button>
  </div>

  <div id="resultado"></div>

  <script>
    async function buscarTransformadores() {
      const potencia = document.getElementById("filtroPotencia").value.trim();
      const tensao = document.getElementById("filtroTensao").value.trim();

      // constrói a query string
      let url = "/api/transformador_parcial?";
      const params = [];
      if (potencia) params.push(`potencia=${encodeURIComponent(potencia)}`);
      if (tensao) params.push(`tensao=${encodeURIComponent(tensao)}`);
      url += params.join("&");

      try {
        const resp = await fetch(url);
        const data = await resp.json();

        if (resp.ok) {
          // Mostra de forma mais limpa os transformadores
          let html = "";
          data.forEach(item => {
            const meta = item.meta;
            html += `
              <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
                <b>Subprojeto:</b> ${meta.subprojecto}<br>
                <b>Potência:</b> ${meta.potencia}<br>
                <b>Tensão:</b> ${meta.tensao}<br>
                <b>Duração:</b> ${meta.duracao} h<br>
                <b>Água removida:</b> ${meta.aguaRemovida} L<br>
                <b>Taxa Total:</b> ${meta.taxaTotal} L/(h·t)<br>
                <b>Máx TE:</b> ${meta.maxTE || "N/A"}<br>
                <b>Min PE_4_17:</b> ${meta.minPE_4_17 || "N/A"}<br>
                <b>Min PE_5_5_1:</b> ${meta.minPE_5_5_1 || "N/A"}<br>
              </div>
            `;
          });
          document.getElementById("resultado").innerHTML = html;
        } else {
          document.getElementById("resultado").innerText = data.erro || "Erro na pesquisa.";
        }
      } catch (err) {
        console.error("Erro fetch:", err);
        document.getElementById("resultado").innerText = "Falha na ligação à API.";
      }
    }
  </script>
</body>
</html>
