<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Filtragem de Transformadores com Índices</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: 40px auto;
      background: linear-gradient(to bottom right, #f7f7f7, #e1e1e1);
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #34495e;
    }
    input, button {
      padding: 10px;
      width: 100%;
      margin-top: 8px;
      border-radius: 5px;
      border: 1px solid #bbb;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      background-color: #2980b9;
      color: white;
      border: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background-color: #3498db;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    #resultado {
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 8px;
      min-height: 100px;
      overflow-x: auto;
    }
    .transformador-dados {
      background: #fdfdfd;
      border: 1px solid #ccc;
      padding: 15px 20px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #bbb;
      padding: 6px 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
  </style>
</head>
<body>

<h1>Filtragem de Transformadores com Índices</h1>

<label for="potenciaInput">Potência (ex: 40000):</label>
<input type="text" id="potenciaInput" placeholder="Potência">

<label for="tensaoInput">Tensão (ex: 150):</label>
<input type="text" id="tensaoInput" placeholder="Tensão">

<button id="btnFiltrar">Pesquisar</button>

<div id="resultado">Resultados aparecerão aqui.</div>

<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  return n.toFixed(dec);
}

function calculaIndiceTemperatura(pf, rf) {
  if (pf == null || rf == null) return 'N/A';
  const diff = rf - pf;
  if (diff >= 5) return '100%';
  if (diff <= -5) return '0%';
  return Math.round((diff+5)/10*100) + '%';
}

function calculaIndicePressao(pf, rf) {
  if (pf == null || rf == null) return 'N/A';
  const diff = rf - pf;
  if (diff >=5) return '0%';
  if (diff <=-5) return '100%';
  return Math.round((5-diff)/10*100) + '%';
}

function desenharGrafico(labels, taxas, canvasId) {
  const ctx = document.getElementById(canvasId).getContext("2d");
  new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Taxa de Remoção (L/h*t)",
        data: taxas,
        borderColor: "#2980b9",
        backgroundColor: "rgba(52,152,219,0.2)",
        fill: true,
        tension: 0.2,
        pointRadius: 3
      }]
    },
    options: {
      scales: { y: { beginAtZero:true }, x:{} }
    }
  });
}

document.getElementById('btnFiltrar').addEventListener('click', async () => {
  const potencia = document.getElementById('potenciaInput').value.trim();
  const tensao = document.getElementById('tensaoInput').value.trim();
  if(!potencia || !tensao) { alert('Preenche ambos os campos!'); return; }

  const url = `/api/transformador_parcial?potencia=${encodeURIComponent(potencia)}&tensao=${encodeURIComponent(tensao)}`;
  const resp = await fetch(url);
  const data = await resp.json();

  if(!resp.ok) {
    document.getElementById('resultado').textContent = data.erro || 'Erro na pesquisa';
    return;
  }

  let html = `<strong>${data.length} transformador(es) encontrado(s)</strong>`;

  data.forEach((item,i)=>{
    const meta = item.meta;
    html += `<div class="transformador-dados">
      <strong>#${i+1} — Subprojeto:</strong> ${meta.subprojecto}<br>
      <strong>Potência:</strong> ${meta.potencia}<br>
      <strong>Tensão:</strong> ${meta.tensao}<br>
      <strong>Duração:</strong> ${meta.duracao} h<br>
      <strong>Água removida:</strong> ${meta.aguaRemovida} L<br>
      <strong>Taxa Total:</strong> ${meta.taxaTotal} L/(h·t)<br>
      <strong>Máx TE:</strong> ${meta.maxTE || 'N/A'}<br>
      <strong>Min PE_4_17:</strong> ${meta.minPE_4_17 || 'N/A'}<br>
      <strong>Min PE_5_5_1:</strong> ${meta.minPE_5_5_1 || 'N/A'}<br>`;

    // Índices TAquec
    if(meta.indice_taquec){
      html += `<h4>Índices TAquec</h4><table><thead><tr><th>Nº</th><th>PF</th><th>RF</th><th>Índice</th></tr></thead><tbody>`;
      meta.indice_taquec.forEach((t,j)=>{
        html += `<tr><td>${t.TAquec}</td><td>${formatNum(t.PF)}</td><td>${formatNum(t.RF)}</td><td>${t.indice}</td></tr>`;
      });
      html += `</tbody></table>`;
    }

    // Índices PRem
    if(meta.indice_prem){
      html += `<h4>Índices PRem</h4><table><thead><tr><th>Nº</th><th>PF</th><th>RF</th><th>Índice</th></tr></thead><tbody>`;
      meta.indice_prem.forEach((p,j)=>{
        html += `<tr><td>${p.PRem}</td><td>${formatNum(p.PF)}</td><td>${formatNum(p.RF)}</td><td>${p.indice}</td></tr>`;
      });
      html += `</tbody></table>`;
    }

    // Gráfico
    const canvasId = `grafico_${i}`;
    html += `<canvas id="${canvasId}" height="200"></canvas>`;
    html += `</div>`;

    // Prepara dados do gráfico
    if(item.blocos){
      const labels = item.blocos.map(b=>b.intervalo);
      const taxas = item.blocos.map(b=>b.taxa);
      setTimeout(()=>desenharGrafico(labels, taxas, canvasId),0);
    }
  });

  document.getElementById('resultado').innerHTML = html;
});
</script>

</body>
</html>
