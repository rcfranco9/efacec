<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Consulta Transformador - Base de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 20px;
  background: #f0f2f5;
  color: #333;
}

h2 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 20px;
}

input, button {
  padding: 8px 12px;
  margin: 5px 5px 20px 0;
  border-radius: 4px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background-color: #3498db;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #2980b9;
}

.bloco-transformador {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.bloco-transformador:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

h3 {
  margin-bottom: 10px;
  color: #2c3e50;
}

h4 {
  margin-top: 15px;
  color: #34495e;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}

p, li {
  margin: 3px 0;
  font-size: 14px;
}

ul {
  padding-left: 20px;
}

table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background-color: #3498db;
  color: white;
}

canvas {
  margin-top: 15px;
  border-radius: 8px;
  background: #f7f9fc;
  padding: 10px;
}

#btnExportarPDF {
  display: block;
  background-color: #27ae60;
  margin: 0 auto 30px auto;
}

#btnExportarPDF:hover {
  background-color: #1e8449;
}
</style>
</head>
<body>

<h2>Consulta Transformador (Base: meubanco)</h2>

<input type="text" id="nomeInput" placeholder="Digite o nome do transformador">
<button id="btnBuscar">Buscar</button>
<div id="resultado"></div>
  <h3>Gráfico Taxa L/(h*t) por hora</h3>
<canvas id="graficoTaxa" width="600" height="300"></canvas>
  
<button id="btnExportarPDF" style="display:none;">Exportar PDF</button>

<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf), r = parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  if(r>=p+5) return '100%';
  if(r<=p-5) return '0%';
  if(r===p) return '50%';
  let ind=50+((r-p)*10);
  if(ind<0) ind=0;
  if(ind>100) ind=100;
  return `${Math.round(ind)}%`;
}

function calculaIndicePressao(pf, rf){
  const p=parseFloat(pf), r=parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  const diff=r-p;
  if(diff>=5) return '0%';
  if(diff<=-5) return '100%';
  if(diff===0) return '50%';
  const prop=(5-diff)/10;
  return `${Math.round(prop*100)}%`;
}

function formatarData(d){
  const dia = String(d.getDate()).padStart(2,'0');
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

let encontradosGlobais=[];

document.getElementById('btnBuscar').addEventListener('click', buscarPorNome);

async function buscarPorNome() {
  const nome = document.getElementById('nomeInput').value.trim();
  const out = document.getElementById('resultado');
  if (!nome) { out.textContent = 'Por favor, insira o nome do transformador.'; return; }
  out.textContent = 'Buscando dados...';

  try {
    const res = await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
    if (!res.ok) throw new Error('Erro ao consultar a base de dados.');
    const data = await res.json();
    if (!data.length) { out.textContent = 'Transformador não encontrado.'; return; }

    const t = data[0]; // assume 1 resultado
    const serieRef = t.referencia || [{}];
    const meta = t.meta || {};
    const serie = t.serie || [];

    const formatarData = d => {
      if (!d) return 'N/A';
      const dt = new Date(d);
      return dt.toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    };

    // Extrair informações gerais
    const potencia = meta.potencia || 0;
    const tensao = meta.tensao || 0;
    const massaTotal = meta.massaTotal || 0;
    const massaIsolantes = meta.massaIsolantes || 0;
    const duracao = meta.duracao || 0;
    const aguaRemovida = meta.aguaRemovida || 0;
    const taxaTotal = meta.taxaTotal || 0;
    const taxaUltimas10h = meta.taxaUltimas10h || 0;

    // Extrair PFx/RFx
    const PF_TAquec = serieRef.map(r => [r.PF1TAquec,r.PF2TAquec,r.PF3TAquec,r.PF4TAquec,r.PF5TAquec,r.PF6TAquec])[0];
    const RF_TAquec = serieRef.map(r => [r.RF1TAquec,r.RF2TAquec,r.RF3TAquec,r.RF4TAquec,r.RF5TAquec,r.RF6TAquec])[0];
    const PF_PRem = serieRef.map(r => [r.PF1PRem,r.PF2PRem,r.PF3PRem,r.PF4PRem,r.PF5PRem,r.PF6PRem])[0];
    const RF_PRem = serieRef.map(r => [r.RF1PRem,r.RF2PRem,r.RF3PRem,r.RF4PRem,r.RF5PRem,r.RF6PRem])[0];

    function calcularIndice(pf, rf){ if(!pf && !rf) return 'N/A'; if(rf>=pf+5) return '100%'; if(rf<=pf-5) return '0%'; if(rf===pf) return '50%'; return `${Math.round(50+(rf-pf)*10)}%`; }
    function calcularIndicePressao(pf, rf){ if(!pf && !rf) return 'N/A'; const diff=rf-pf; if(diff>=5) return '0%'; if(diff<=-5) return '100%'; if(diff===0) return '50%'; return `${Math.round((5-diff)/10*100)}%`; }

    let html = `<div class="bloco">`;
    html += `<p><strong>Potência:</strong> ${potencia} kVA</p>`;
    html += `<p><strong>Tensão:</strong> ${tensao} kV</p>`;
    html += `<p><strong>Massa transformador:</strong> ${massaTotal} kg</p>`;
    html += `<p><strong>Massa isolantes:</strong> ${massaIsolantes} t</p>`;
    html += `<p><strong>Duração total:</strong> ${duracao} h</p>`;
    html += `<p><strong>Água removida:</strong> ${aguaRemovida} L</p>`;
    html += `<p><strong>Taxa total:</strong> ${taxaTotal} L/(h*t)</p>`;
    html += `<p><strong>Taxa últimas 10h:</strong> ${taxaUltimas10h} L/(h*t)</p>`;
    html += `<hr>`;

    html += `<h3>Valores PFxTAquec</h3>`; PF_TAquec.forEach((v,i)=> html+=`<p>PF${i+1}TAquec: ${v}</p>`);
    html += `<h3>Valores RFxTAquec</h3>`; RF_TAquec.forEach((v,i)=> html+=`<p>RF${i+1}TAquec: ${v}</p>`);
    html += `<h3>Índices PFxTAquec vs RFxTAquec</h3>`; PF_TAquec.forEach((v,i)=> html+=`<p>Índice PF${i+1} vs RF${i+1}: ${calcularIndice(v, RF_TAquec[i])}</p>`);

    html += `<h3>Valores PFxPRem</h3>`; PF_PRem.forEach((v,i)=> html+=`<p>PF${i+1}PRem: ${v}</p>`);
    html += `<h3>Valores RFxPRem</h3>`; RF_PRem.forEach((v,i)=> html+=`<p>RF${i+1}PRem: ${v}</p>`);
    html += `<h3>Índices PFxPRem vs RFxPRem</h3>`; PF_PRem.forEach((v,i)=> html+=`<p>Índice PF${i+1} vs RF${i+1} (pressão): ${calcularIndicePressao(v, RF_PRem[i])}</p>`);

    // Primeira hora PE_5_5_1 < 20
    const serieOrdenada = serie.slice().sort((a,b)=>new Date(a.DataHora)-new Date(b.DataHora));
    let primeiraHoraPressaoBaixa=null;
    for(const l of serieOrdenada){
      const p = parseFloat(l.PE_5_5_1);
      if(!isNaN(p) && p<20){ primeiraHoraPressaoBaixa=new Date(l.DataHora); break; }
    }
    html += `<p><strong>Primeira hora com pressão PE_5_5_1 abaixo de 20 mbar:</strong> ${formatarData(primeiraHoraPressaoBaixa)}</p>`;

    // Zonas de remoção RFxDRem
    let dataAnterior = primeiraHoraPressaoBaixa || new Date();
    for(let fase=1; fase<=6; fase++){
      const aquec = parseFloat(serieRef[0][`RF${fase}DAquec`]);
      const rem = parseFloat(serieRef[0][`RF${fase}DRem`]);
      if(aquec>0 && rem>0){
        const inicioRem = new Date(dataAnterior.getTime() + aquec*3600000);
        const fimRem = new Date(inicioRem.getTime() + rem*3600000);
        html += `<p><strong>Início da zona de remoção RF${fase}DRem:</strong> ${formatarData(inicioRem)}</p>`;
        html += `<p><strong>Fim da zona de remoção RF${fase}DRem:</strong> ${formatarData(fimRem)}</p>`;
        dataAnterior = fimRem;
      } else {
        html += `<p><strong>A secagem não chegou à fase RF${fase}DRem.</strong></p>`;
        break;
      }
    }

    html += `</div>`;
    out.innerHTML = html;

    criarGraficoTaxaHoraAHora('graficoTaxa', serie, massaTotal/1000); // massaTon = kg -> t
 
  } catch(err) {
    console.error(err);
    out.textContent = 'Erro ao buscar os dados.';
  }
}


// --- Gráficos ---
function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!dadosSerie.length) return;
  const labels=dadosSerie.map(l=>l.DataHora);
  const valores=dadosSerie.map(l=>parseFloat(l.LC_3_8)/massaTon || 0);
  new Chart(ctx,{type:'line',data:{labels, datasets:[{label:'Taxa LC L/(h*t)', data:valores, borderColor:'blue', fill:false}]}, options:{responsive:true}});
}

function criarGraficoPF_RF(idCanvas, referencia){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!referencia.length) return;
  const labels=['PF1','PF2','PF3','PF4','PF5','PF6'];
  const pf=labels.map(l=>referencia[0][l+'TAquec']||0);
  const rf=labels.map(l=>referencia[0][l.replace('PF','RF')+'TAquec']||0);
  new Chart(ctx,{type:'bar',data:{labels, datasets:[{label:'PF', data:pf, backgroundColor:'rgba(52,152,219,0.7)'},{label:'RF', data:rf, backgroundColor:'rgba(231,76,60,0.7)'}]}});
}

function criarGraficoLC(idCanvas, serie){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!serie.length) return;
  const labels=serie.map(l=>l.DataHora);
  const valores=serie.map(l=>l.LC_3_8||0);
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'LC_3_8', data:valores, borderColor:'green', fill:false}]}, options:{responsive:true}});
}

// --- PDF Export ---
document.getElementById('btnExportarPDF').addEventListener('click',()=>{
  html2canvas(document.body).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const imgProps=pdf.getImageProperties(imgData);
    const pdfWidth=210;
    const pdfHeight=(imgProps.height * pdfWidth)/imgProps.width;
    pdf.addImage(imgData,'PNG',0,0,pdfWidth,pdfHeight);
    pdf.save('transformador.pdf');
  });
});
</script>

</body>
</html>
