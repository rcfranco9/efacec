<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Consulta Transformador por Nome</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: 40px auto;
      background: #f5f5f5;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h1 { text-align: center; color: #2c3e50; }
    label { font-weight: bold; display: block; margin-top: 20px; color: #34495e; }
    input, button {
      padding: 10px; width: 100%; margin-top: 5px; border-radius: 5px;
      border: 1px solid #bbb; font-size: 15px; box-sizing: border-box;
    }
    button { margin-top: 15px; background-color: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover:not(:disabled) { background-color: #3498db; }
    #resultado { margin-top: 30px; padding: 20px; border: 2px solid #ccc; background: #fff; border-radius: 8px; line-height: 1.6; }
    .bloco-transformador { margin-top: 25px; padding: 15px 20px; background: #ecf0f1; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .bloco-transformador h3 { margin-top: 0; background: #d6eaf8; padding: 10px; border-radius: 5px; font-size: 18px; }
    .coluna-dados { display: flex; flex-wrap: wrap; gap: 20px; }
    .coluna-dados > div { flex: 1 1 45%; }
    strong { color: #2c3e50; }
    hr { margin: 20px 0; border-top: 1px dashed #aaa; }
  </style>
</head>
<body>

<h1>Consulta de Transformadores</h1>

<label for="nomeInput">Nome do transformador:</label>
<input type="text" id="nomeInput" placeholder="Insere o nome do transformador" />
<button onclick="buscarPorNome()" id="btnBuscar">Procurar</button>

<div id="resultado">Insere o nome do transformador e clica em "Procurar".</div>
<button id="btnExportarPDF" style="display: none; margin-top: 20px;">Exportar para PDF</button>

<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0 (ZERO)';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf);
  const r = parseFloat(rf);
  if (isNaN(p) || isNaN(r)) return 'N/A';
  if (r >= p + 5) return '100%';
  if (r <= p - 5) return '0%';
  if (r === p) return '50%';
  let indice = 50 + ((r - p) * 10);
  if (indice < 0) indice = 0;
  if (indice > 100) indice = 100;
  return `${Math.round(indice)}%`;
}

function calculaIndicePressao(pf, rf) {
  const p = parseFloat(pf);
  const r = parseFloat(rf);
  if (isNaN(p) || isNaN(r)) return 'N/A';
  const diff = r - p;
  if (diff >= 5) return '0%';
  if (diff <= -5) return '100%';
  if (diff === 0) return '50%';
  const proporcao = (5 - diff) / 10;
  const indice = Math.round(proporcao * 100);
  return `${indice}%`;
}

function buscarPorNome() {
  const nome = document.getElementById('nomeInput').value.trim().toLowerCase();
  const out = document.getElementById('resultado');

  if (!nome) { out.textContent = 'Por favor, insere o nome do transformador.'; return; }

  fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`)
    .then(res => res.json())
    .then(data => {
      if (data.erro) { out.textContent = data.erro; return; }

      let html = `<h2>Resultados para: <strong>${data[0].meta.subprojecto}</strong></h2>`;

      data.forEach((item, index) => {
        const meta = item.meta;
        const serie = item.serie;
        const serieRef = item.referencia;

        const massaiTon = Number(meta.massai)/1000;
        const datas = serie.map(l => new Date(l.DataHora)).sort((a,b) => a-b);
        const duracao = (datas[datas.length-1]-datas[0])/36e5;
        const valoresLC = serie.map(l => Number(l.LC_3_8)).filter(n=>!isNaN(n));
        const difLC = valoresLC.length ? valoresLC[valoresLC.length-1] : 0;
        const taxaLC = difLC/(duracao*massaiTon);

        html += `<div class="bloco-transformador">
                  <h3>#${index+1} — ID: ${meta.id_secagenscore}</h3>
                  <div class="coluna-dados">
                    <div>
                      <p><strong>Potência:</strong> ${meta.potencia || 'N/A'} kVA</p>
                      <p><strong>Tensão:</strong> ${meta.tensao || 'N/A'} kV</p>
                      <p><strong>Massa transformador:</strong> ${meta.massat || 'N/A'} kg</p>
                      <p><strong>Massa isolantes:</strong> ${formatNum(massaiTon,3)} t</p>
                    </div>
                    <div>
                      <p><strong>Duração total:</strong> ${formatNum(duracao,2)} h</p>
                      <p><strong>Água removida:</strong> ${formatNum(difLC)}</p>
                      <p><strong>Taxa total:</strong> ${formatNum(taxaLC)} (L/(h*t))</p>
                    </div>
                  </div>
                  <hr>
                  <canvas id="graficoTaxa${index}" width="600" height="300" style="background:#fff; border:1px solid #ccc; border-radius:6px; margin-top:15px;"></canvas>
                </div>`;

        criarGraficoTaxaHoraAHora('graficoTaxa'+index, serie, massaiTon);
      });

      out.innerHTML = html;
      document.getElementById('btnExportarPDF').style.display = data.length ? 'block' : 'none';
    })
    .catch(err => out.textContent = 'Erro ao buscar dados: ' + err);
}

function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon) {
  const dadosPorHora = {};
  dadosSerie.forEach(linha => {
    const dataHora = new Date(linha.DataHora);
    if (isNaN(dataHora)) return;
    dataHora.setMinutes(0,0,0);
    const chave = dataHora.getTime();
    if (!dadosPorHora[chave]) dadosPorHora[chave] = [];
    const valorLC = parseFloat(linha.LC_3_8);
    if (!isNaN(valorLC)) dadosPorHora[chave].push(valorLC);
  });

  const chavesOrdenadas = Object.keys(dadosPorHora).sort((a,b)=>a-b);
  const labelsHoras = chavesOrdenadas.map(ts => (new Date(Number(ts)).getHours()+1)+'h');
  const taxasHoraAHora = chavesOrdenadas.map(chave => {
    const vals = dadosPorHora[chave];
    if (!vals || vals.length<2) return 0;
    return (vals[vals.length-1]-vals[0])/(1*massaTon);
  });

  const canvasEl = document.getElementById(idCanvas);
  if (!canvasEl) return;

  if (window[idCanvas+'_chart']) window[idCanvas+'_chart'].destroy();
  const ctx = canvasEl.getContext('2d');
  window[idCanvas+'_chart'] = new Chart(ctx, {
    type:'line',
    data: { labels: labelsHoras, datasets:[{label:'Taxa LC por hora (L/(h*t))', data:taxasHoraAHora, borderColor:'rgba(75,192,192,1)', backgroundColor:'rgba(75,192,192,0.5)', fill:false, tension:0.2}]},
    options:{responsive:true, scales:{x:{title:{display:true,text:'Hora'}},y:{title:{display:true,text:'Taxa LC'},beginAtZero:true}}}
  });
}

// Exportar para PDF
document.getElementById('btnExportarPDF').addEventListener('click',()=>{
  html2canvas(document.getElementById('resultado')).then(canvas=>{
    const img = canvas.toDataURL('image/png');
    const pdf = new jspdf.jsPDF('p','pt','a4');
    const ratio = Math.min(pdf.internal.pageSize.getWidth()/canvas.width, pdf.internal.pageSize.getHeight()/canvas.height);
    pdf.addImage(img,'PNG',(pdf.internal.pageSize.getWidth()-canvas.width*ratio)/2,20,canvas.width*ratio,canvas.height*ratio);
    pdf.save('resultado_transformadores.pdf');
  });
});
</script>

</body>
</html>
