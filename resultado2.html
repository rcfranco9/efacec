<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf), r = parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  if(r>=p+5) return '100%';
  if(r<=p-5) return '0%';
  if(r===p) return '50%';
  let ind=50+((r-p)*10);
  if(ind<0) ind=0;
  if(ind>100) ind=100;
  return `${Math.round(ind)}%`;
}

function calculaIndicePressao(pf, rf){
  const p=parseFloat(pf), r=parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  const diff=r-p;
  if(diff>=5) return '0%';
  if(diff<=-5) return '100%';
  if(diff===0) return '50%';
  const prop=(5-diff)/10;
  return `${Math.round(prop*100)}%`;
}

      const aquecValido = !isNaN(tempoAquec) && tempoAquec>0;

        const fimAquec = new Date(dataAnterior.getTime() + tempoAquec*3600000);

        break;
      }
    }
  } else {
    html += `<p><strong>Pressão PE_5_5_1 nunca ficou abaixo de 20 mbar.</strong></p>`;
  }


});

    let dataAnterior = d;
    const fases = [1,2,3,4,5,6];
    if(!referencia.length){

      }
    }
    } catch(e){
  console.error(e);
  html += `<p><strong>Erro ao calcular pressões e zonas de remoção.</strong></p>`;
}


html += `</div>`;

      // Taxas últimas 18h em blocos de 3h
      const taxas3h=[];
      if(serie.length>=2){
        const datas=serie.map(l=>new Date(l.DataHora)).sort((a,b)=>a-b);
        const final=datas[datas.length-1];

      html+=`<div class="bloco-transformador">

        <hr>`;

      // PFx/RFx e índices
      html+=`<h4>Valores PFxTAquec</h4>`;
      for(let n=1;n<=6;n++) html+=`<p>PF${n}TAquec: ${serieRef[0]?.[`PF${n}TAquec`]||0}</p>`;
      html+=`<h4>Valores RFxTAquec</h4>`;

// --- Gráficos ---
function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon, idx){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!massaTon) return;
  const dadosPorHora={};
  dadosSerie.forEach(l=>{
    const d=new Date(l.DataHora);
    const val=parseFloat(l.LC_3_8);
    if(isNaN(d)||isNaN(val)) return;
    d.setMinutes(0,0,0);
    const chave=d.getTime();
    if(!dadosPorHora[chave]) dadosPorHora[chave]=[];
    dadosPorHora[chave].push(val);
  });
  const chaves=Object.keys(dadosPorHora).sort((a,b)=>a-b);
  const labels=chaves.map(t=>new Date(Number(t)).toLocaleTimeString());
  const taxas=chaves.map(c=>{
    const v=dadosPorHora[c];
    return v.length>=2?(v[v.length-1]-v[0])/massaTon:0;
  });
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Taxa LC (L/(h*t))',data:taxas,borderColor:'blue',fill:false,pointRadius:3,tension:0.2}]},options:{responsive:true}});
}

function criarGraficoPF_RF(idCanvas, referencia, idx){
  if(!referencia||!referencia.length) return;
  const labels=referencia.map((_,i)=>`Etapa ${i+1}`);
  const pf=referencia.map(r=>parseFloat(r.PF1)||0);
  const rf=referencia.map(r=>parseFloat(r.RF1)||0);
  const ctx=document.getElementById(idCanvas);
  if(!ctx) return;
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'PF',data:pf,borderColor:'red',fill:false},{label:'RF',data:rf,borderColor:'green',fill:false}]},options:{responsive:true}});
}

function criarGraficoLC(idCanvas, serie, idx){
  if(!serie||!serie.length) return;
  const labels=serie.map(l=>new Date(l.DataHora).toLocaleString());
  const valores=serie.map(l=>parseFloat(l.LC_3_8)||0);
  const ctx=document.getElementById(idCanvas);
  if(!ctx) return;
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'LC acumulado (L)',data:valores,borderColor:'purple',fill:false}]},options:{responsive:true}});
}

// --- Export PDF ---
document.getElementById('btnExportarPDF').addEventListener('click', ()=>{
  const el=document.getElementById('resultado');
  html2canvas(el).then(canvas=>{
    const img=canvas.toDataURL('image/png');
    const pdf=new jspdf.jsPDF('p','pt','a4');
    const w=pdf.internal.pageSize.getWidth();
    const h=pdf.internal.pageSize.getHeight();
    const iw=canvas.width;
    const ih=canvas.height;
    const ratio=Math.min(w/iw,h/ih);
    pdf.addImage(img,'PNG',(w-iw*ratio)/2,20,iw*ratio,ih*ratio);
    pdf.save('resultado_transformadores.pdf');
  });
});
