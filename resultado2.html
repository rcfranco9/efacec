<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Consulta Transformador - Base de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin:20px; background:#f5f5f5; }
input, button { padding:6px 10px; margin:5px 0; }
.bloco-transformador { background:#fff; padding:15px; border-radius:6px; margin-bottom:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.coluna-dados { display:flex; justify-content:space-between; margin-bottom:10px; }
.coluna-dados div { flex:1; margin-right:15px; }
table { width:100%; margin-top:10px; border-collapse:collapse; }
th, td { border:1px solid #ccc; padding:5px; text-align:center; }
th { background:#eee; }
</style>
</head>
<body>

<h2>Consulta Transformador (Base: meubanco)</h2>

<input type="text" id="nomeInput" placeholder="Digite o nome do transformador">
<button id="btnBuscar">Buscar</button>
<div id="resultado"></div>
<button id="btnExportarPDF" style="display:none; margin-top:20px;">Exportar PDF</button>

<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0 (ZERO)';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf);
  const r = parseFloat(rf);
  if (isNaN(p) || isNaN(r)) return 'N/A';
  if (r >= p + 5) return '100%';
  if (r <= p - 5) return '0%';
  if (r === p) return '50%';
  let indice = 50 + ((r - p) * 10);
  if (indice < 0) indice = 0;
  if (indice > 100) indice = 100;
  return `${Math.round(indice)}%`;
}

function calculaIndicePressao(pf, rf) {
  const p = parseFloat(pf);
  const r = parseFloat(rf);
  if (isNaN(p) || isNaN(r)) return 'N/A';
  const diff = r - p;
  if (diff >= 5) return '0%';
  if (diff <= -5) return '100%';
  if (diff === 0) return '50%';
  const proporcao = (5 - diff) / 10;
  const indice = Math.round(proporcao * 100);
  return `${indice}%`;
}

let encontradosGlobais = [];

document.getElementById('btnBuscar').addEventListener('click', buscarPorNome);

async function buscarPorNome() {
  const nome = document.getElementById('nomeInput').value.trim();
  const out = document.getElementById('resultado');
  if (!nome) { out.textContent = 'Por favor, insere o nome do transformador.'; return; }

  out.textContent = 'Buscando dados...';

  try {
    const res = await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
    if (!res.ok) throw new Error('Erro ao consultar a base de dados.');
    const data = await res.json();
    if (!data.length) { out.textContent = 'Transformador não encontrado.'; return; }

    encontradosGlobais = data;
    let html = `<h2>Resultados para: <strong>${nome}</strong></h2>`;

    data.forEach((item, index) => {
      const meta = item.meta;
      const serie = item.serie.filter(l => l.LC_3_8 !== undefined && l.DataHora);
      const referencia = item.referencia || [];
      const massaiTon = Number(meta.massai) / 1000 || 0;

      // Calcular dif, taxa total
      const valoresLC = serie.map(l => parseFloat(l.LC_3_8)).filter(v => !isNaN(v));
      const difLC = valoresLC.length ? valoresLC[valoresLC.length-1] - valoresLC[0] : 0;
      const datas = serie.map(l => new Date(l.DataHora)).filter(d => !isNaN(d)).sort((a,b) => a-b);
      const duracao = datas.length > 1 ? (datas[datas.length-1]-datas[0])/36e5 : 0;
      const taxaLC = duracao && massaiTon ? difLC/(duracao*massaiTon) : 0;

      // Últimas 10h
      let taxa10h = 0;
      if (datas.length > 0) {
        const final = datas[datas.length-1];
        const inicial = new Date(final.getTime() - 10*3600000);
        const ultimos = serie.filter(l => {
          const d = new Date(l.DataHora);
          return d >= inicial && d <= final;
        }).sort((a,b)=>new Date(a.DataHora)-new Date(b.DataHora));

        if (ultimos.length>=2){
          const difLC10h = parseFloat(ultimos[ultimos.length-1].LC_3_8) - parseFloat(ultimos[0].LC_3_8);
          taxa10h = difLC10h/(10*massaiTon);
        }
      }

      // Primeira hora com PE_5_5_1 < 20 mbar
      let primeiraHoraPressaoBaixa = 'N/A';
      for (const l of serie) {
        const pe = parseFloat(l.PE_5_5_1);
        if (!isNaN(pe) && pe < 20) {
          primeiraHoraPressaoBaixa = l.DataHora;
          break;
        }
      }

      // Fases RFxDRem
      const fasesRem = referencia.map(r => r.RFxDRem || 'N/A').join(', ');

      html += `<div class="bloco-transformador">
        <h3>#${index+1} — ID: ${meta.id_secagenscore}</h3>
        <div class="coluna-dados">
          <div>
            <p><strong>Potência:</strong> ${meta.potencia || 'N/A'} kVA</p>
            <p><strong>Tensão:</strong> ${meta.tensao || 'N/A'} kV</p>
            <p><strong>Massa transformador:</strong> ${meta.massat || 'N/A'} kg</p>
            <p><strong>Massa isolantes:</strong> ${formatNum(massaiTon)} t</p>
          </div>
          <div>
            <p><strong>Duração total:</strong> ${formatNum(duracao,2)} h</p>
            <p><strong>Água removida:</strong> ${formatNum(difLC)} L</p>
            <p><strong>Taxa total:</strong> ${formatNum(taxaLC)} (L/(h*t))</p>
            <p><strong>Taxa últimas 10h:</strong> ${formatNum(taxa10h)} (L/(h*t))</p>
            <p><strong>Primeira hora PE<20 mbar:</strong> ${primeiraHoraPressaoBaixa}</p>
            <p><strong>Fases RFxDRem:</strong> ${fasesRem}</p>
          </div>
        </div>

        <h4>Índices PF vs RF</h4>
        <table>
          <tr><th>Etapa</th><th>PF</th><th>RF</th><th>Índice Temp</th><th>Índice Pressão</th></tr>
          ${referencia.map(r => `
            <tr>
              <td>${r.Etapa || 'Secagem'}</td>
              <td>${r.PF1 || 'N/A'}</td>
              <td>${r.RF1 || 'N/A'}</td>
              <td>${calcularIndice(r.PF1, r.RF1)}</td>
              <td>${calculaIndicePressao(r.PF1, r.RF1)}</td>
            </tr>
          `).join('')}
        </table>

        <!-- Apenas o gráfico da taxa LC por hora -->
        <canvas id="graficoTaxa${index}" width="600" height="300" style="margin-top:15px;"></canvas>
      </div>`;
    });

    out.innerHTML = html;
    document.getElementById('btnExportarPDF').style.display = 'block';

    // Criar gráficos após HTML estar no DOM
    data.forEach((item, index) => {
      const serie = item.serie.filter(l => l.LC_3_8 !== undefined && l.DataHora);
      const massaiTon = Number(item.meta.massai)/1000 || 0;
      criarGraficoTaxaHoraAHora('graficoTaxa'+index, serie, massaiTon, index);
    });

  } catch(err){
    console.error(err);
    out.textContent = 'Erro ao consultar a base de dados.';
  }
}

// --- Função de gráfico de taxa LC por hora ---
function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon, idx){
  const ctx = document.getElementById(idCanvas);
  if(!ctx || !massaTon) return;

  const dadosPorHora = {};
  dadosSerie.forEach(l=>{
    const d = new Date(l.DataHora);
    const val = parseFloat(l.LC_3_8);
    if(isNaN(d) || isNaN(val)) return;
    d.setMinutes(0,0,0);
    const chave = d.getTime();
    if(!dadosPorHora[chave]) dadosPorHora[chave] = [];
    dadosPorHora[chave].push(val);
  });

  const chaves = Object.keys(dadosPorHora).sort((a,b)=>a-b);
  const labels = chaves.map(t=>new Date(Number(t)).toLocaleTimeString());
  const taxas = chaves.map(chave => {
    const v = dadosPorHora[chave];
    return (v && v.length>=2) ? (v[v.length-1]-v[0])/massaTon : 0;
  });

  if(window['chartTaxa_'+idx]) window['chartTaxa_'+idx].destroy();
  window['chartTaxa_'+idx] = new Chart(ctx,{
    type:'line',
    data:{ labels, datasets:[{label:'Taxa LC por hora (L/(h*t))', data:taxas, borderColor:'blue', fill:false, pointRadius:3, tension:0.2}] },
    options:{ responsive:true }
  });
}

// --- Export PDF ---
document.getElementById('btnExportarPDF').addEventListener('click', ()=>{
  const el=document.getElementById('resultado');
  html2canvas(el).then(canvas=>{
    const img=canvas.toDataURL('image/png');
    const pdf=new jspdf.jsPDF('p','pt','a4');
    const w=pdf.internal.pageSize.getWidth();
    const h=pdf.internal.pageSize.getHeight();
    const iw=canvas.width;
    const ih=canvas.height;
    const ratio=Math.min(w/iw,h/ih);
    pdf.addImage(img,'PNG',(w-iw*ratio)/2,20,iw*ratio,ih*ratio);
    pdf.save('resultado_transformadores.pdf');
  });
});
</script>

</body>
</html>
