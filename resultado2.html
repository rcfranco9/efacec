<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Consulta Transformador - Base de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* --- Estilo geral --- */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}
h1, h2, h3 {
  text-align: center;
  color: #2c3e50;
}
input, button {
  padding: 10px 15px;
  margin: 5px 5px 20px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}
button {
  background-color: #3498db;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background-color: #2980b9; }
.bloco {
  background: #f7f9fc;
  padding: 15px 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}
.bloco h3 { margin-top: 0; color: #34495e; }
.bloco p { margin: 3px 0; font-size: 14px; }
canvas { display: block; margin: 0 auto 20px auto; border-radius: 8px; background: #fff; padding: 10px; }
#btnExportarPDF { display: block; background-color: #27ae60; margin: 0 auto 30px auto; }
#btnExportarPDF:hover { background-color: #1e8449; }
</style>
</head>
<body>

<div class="container">
<h1>Consulta Transformador</h1>

<div style="text-align:center; margin-bottom:20px;">
<input type="text" id="nomeInput" placeholder="Digite o nome do transformador">
<button id="btnBuscar">Buscar</button>
</div>

<div id="resultado"></div>

<h2>Gráfico Taxa L/(h*t) por hora</h2>
<canvas id="graficoTaxa" width="700" height="350"></canvas>

<button id="btnExportarPDF" style="display:none;">Exportar PDF</button>
</div>

<script>
let graficoTaxa = null;

function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf), r = parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  if(r>=p+5) return '100%';
  if(r<=p-5) return '0%';
  if(r===p) return '50%';
  let ind=50+((r-p)*10);
  if(ind<0) ind=0;
  if(ind>100) ind=100;
  return `${Math.round(ind)}%`;
}

function calculaIndicePressao(pf, rf){
  const p=parseFloat(pf), r=parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  const diff=r-p;
  if(diff>=5) return '0%';
  if(diff<=-5) return '100%';
  if(diff===0) return '50%';
  const prop=(5-diff)/10;
  return `${Math.round(prop*100)}%`;
}

function formatarData(d){
  if(!d) return 'N/A';
  const dia = String(d.getDate()).padStart(2,'0');
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

document.getElementById('btnBuscar').addEventListener('click', buscarPorNome);

async function buscarPorNome() {
  const nome = document.getElementById('nomeInput').value.trim();
  const out = document.getElementById('resultado');
  if (!nome) { 
    out.textContent = 'Por favor, insira o nome do transformador.'; 
    return; 
  }
  out.textContent = 'Buscando dados...';

  try {
    const res = await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
    if (!res.ok) throw new Error('Erro ao consultar a base de dados.');
    const data = await res.json();
    console.log("📦 Dados recebidos da API:", data);

    if (!data.length) { 
      out.textContent = 'Transformador não encontrado.'; 
      return; 
    }

    const t = data[0];
    const serieRef = t.referencia || [{}];
    const meta = t.meta || {};
    const serie = t.serie || [];
    const secagem = t.secagem || {};

    // Massa transformador (kg) / isolantes (t)
    let massaTon = parseFloat(meta.massat)/1000;
    if (isNaN(massaTon)) {
      massaTon = 100;
      console.warn("⚠️ MassaTon não veio da API. Usando fallback 100 t");
    }

    // --- Calcular duração correta ---
   // --- Calcular duração usando secagens_core ---
let duracao = 0;
if(referencia.length > 0){
    const inicioSecagem = referencia[0].datainicio ? new Date(referencia[0].datainicio) : null;
    const fimSecagem = referencia[0].datafim ? new Date(referencia[0].datafim) : null;
    if(inicioSecagem && fimSecagem){
        duracao = (fimSecagem - inicioSecagem) / 3600000; // diferença em horas
    }
}




    // --- Bloco Meta ---
    let html = `<div class="bloco"><h3>Informações do Transformador</h3>`;
    html += `<p><strong>Potência:</strong> ${meta.potencia || 0} kVA</p>`;
    html += `<p><strong>Tensão:</strong> ${meta.tensao || 0} kV</p>`;
    html += `<p><strong>Massa transformador:</strong> ${meta.massat || 0} kg</p>`;
    html += `<p><strong>Massa isolantes:</strong> ${meta.massai || 0} t</p>`;
   html += `<p><strong>Duração total:</strong> ${duracao.toFixed(2)} h</p>`;
    html += `<p><strong>Água removida:</strong> ${meta.aguaRemovida || 0} L</p>`;
    html += `<p><strong>Taxa total:</strong> ${meta.taxaTotal || 0} L/(h*t)</p>`;
    html += `<p><strong>Taxa últimas 10h:</strong> ${meta.taxaUltimas10h || 0} L/(h*t)</p>`;
    html += `</div>`;

    // --- Bloco PF/RF ---
    html += `<div class="bloco"><h3>PF/RF e Índices</h3>`;
    const PF_TAquec = serieRef.map(r => [r.PF1TAquec,r.PF2TAquec,r.PF3TAquec,r.PF4TAquec,r.PF5TAquec,r.PF6TAquec])[0];
    const RF_TAquec = serieRef.map(r => [r.RF1TAquec,r.RF2TAquec,r.RF3TAquec,r.RF4TAquec,r.RF5TAquec,r.RF6TAquec])[0];
    const PF_PRem = serieRef.map(r => [r.PF1PRem,r.PF2PRem,r.PF3PRem,r.PF4PRem,r.PF5PRem,r.PF6PRem])[0];
    const RF_PRem = serieRef.map(r => [r.RF1PRem,r.RF2PRem,r.RF3PRem,r.RF4PRem,r.RF5PRem,r.RF6PRem])[0];

    PF_TAquec.forEach((v,i)=> html+=`<p>PF${i+1}TAquec: ${v} | RF${i+1}TAquec: ${RF_TAquec[i]} | Índice: ${calcularIndice(v, RF_TAquec[i])}</p>`);
    PF_PRem.forEach((v,i)=> html+=`<p>PF${i+1}PRem: ${v} | RF${i+1}PRem: ${RF_PRem[i]} | Índice pressão: ${calculaIndicePressao(v, RF_PRem[i])}</p>`);
    html += `</div>`;

    // --- Bloco fases de secagem ---
    html += `<div class="bloco"><h3>Fases de Secagem</h3>`;
    const serieOrdenada = serie.slice().sort((a,b)=>new Date(a.DataHora)-new Date(b.DataHora));
    let primeiraHoraPressaoBaixa = null;
    for(const l of serieOrdenada){
      const p = parseFloat(l.PE_5_5_1);
      if(!isNaN(p) && p<20){ primeiraHoraPressaoBaixa=new Date(l.DataHora); break; }
    }
    html += `<p><strong>Primeira hora com pressão PE_5_5_1 abaixo de 20 mbar:</strong> ${formatarData(primeiraHoraPressaoBaixa)}</p>`;
    let dataAnterior = primeiraHoraPressaoBaixa || new Date();
    for(let fase=1; fase<=6; fase++){
      const aquec = parseFloat(serieRef[0][`RF${fase}DAquec`]);
      const rem = parseFloat(serieRef[0][`RF${fase}DRem`]);
      if(aquec>0 && rem>0){
        const inicioRem = new Date(dataAnterior.getTime() + aquec*3600000);
        const fimRem = new Date(inicioRem.getTime() + rem*3600000);
        html += `<p><strong>RF${fase}DRem:</strong> início ${formatarData(inicioRem)}, fim ${formatarData(fimRem)}</p>`;
        dataAnterior = fimRem;
      } else {
        html += `<p><strong>A secagem não chegou à fase RF${fase}DRem.</strong></p>`;
        break;
      }
    }
    html += `</div>`;

    out.innerHTML = html;

    criarGraficoTaxaHoraAHora('graficoTaxa', serie, massaTon);
    document.getElementById('btnExportarPDF').style.display='block';

  } catch(err) {
    console.error(err);
    out.textContent = 'Erro ao buscar os dados.';
  }
}


// --- Gráfico ---
function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon) {
  if (!massaTon || massaTon <= 0) return;
  const dadosPorHora = {};
  dadosSerie.forEach(linha => {
    const dataHora = new Date(linha.DataHora);
    if (isNaN(dataHora)) return;
    dataHora.setMinutes(0,0,0);
    const chaveHora = dataHora.getTime();
    const valorLC = parseFloat(linha.LC_3_8);
    if (isNaN(valorLC)) return;
    if (!dadosPorHora[chaveHora]) dadosPorHora[chaveHora] = [];
    dadosPorHora[chaveHora].push(valorLC);
  });
  const chavesOrdenadas = Object.keys(dadosPorHora).sort((a,b)=>a-b);
  const labelsHoras = [];
  const taxasHoraAHora = [];
  let valorAnterior = null;
  chavesOrdenadas.forEach(chave=>{
    const hora = new Date(Number(chave)).getHours();
    labelsHoras.push(`${hora}h`);
    const valores = dadosPorHora[chave];
    const valorAtual = valores[valores.length-1];
    taxasHoraAHora.push(valorAnterior!==null ? (valorAtual-valorAnterior)/massaTon : 0);
    valorAnterior=valorAtual;
  });
  const ctx = document.getElementById(idCanvas);
  if(!ctx) return;
  if(graficoTaxa) graficoTaxa.destroy();
  graficoTaxa = new Chart(ctx,{
    type:'line',
    data:{ labels: labelsHoras, datasets:[{
      label:'Taxa LC L/(h*t)',
      data: taxasHoraAHora,
      borderColor:'blue',
      backgroundColor:'rgba(52,152,219,0.2)',
      fill:true,
      tension:0.2,
      pointRadius:4
    }]},
    options:{
      responsive:true,
      plugins:{ legend:{position:'top'}, title:{display:true,text:'Taxa LC por Hora'} },
      scales:{ y:{title:{display:true,text:'Taxa LC L/(h*t)'}}, x:{title:{display:true,text:'Hora'}} }
    }
  });
}

// --- Exportar PDF ---
document.getElementById('btnExportarPDF').addEventListener('click',()=>{
  html2canvas(document.body).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const imgProps = pdf.getImageProperties(imgData);
    const pdfWidth = 210;
    const pdfHeight = (imgProps.height * pdfWidth)/imgProps.width;
    pdf.addImage(imgData,'PNG',0,0,pdfWidth,pdfHeight);
    pdf.save('transformador.pdf');
  });
});
</script>
</body>
</html>
