<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Debug Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Teste do Gráfico</h2>

  <input type="text" id="nomeTrans" placeholder="Nome do Transformador">
  <button onclick="buscarPorNome()">Buscar</button>
  <button id="btnExportarPDF" style="display:none;">Exportar PDF</button>

  <br><br>
  <canvas id="graficoTaxa" width="600" height="400"></canvas>

  <script>
    let graficoTaxa = null; // variável global para guardar gráfico

    async function buscarPorNome() {
      const nome = document.getElementById("nomeTrans").value;
      console.log("🔎 Nome pesquisado:", nome);

      try {
        const resp = await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
        if (!resp.ok) {
          console.error("❌ Erro na API:", resp.status);
        }

        const dados = await resp.json();
        console.log("📦 Dados recebidos da API:", dados);

        let serie = dados.serie || [];
        let massaTon = parseFloat(dados.massaTon);

        // Fallback se API não retornar válido
        if (!serie.length || isNaN(massaTon)) {
          console.warn("⚠️ Usando MOCK de dados porque API não retornou válido");
          massaTon = 100; // massa fictícia
          serie = [
            { DataHora: "2025-08-28T10:00:00", LC_3_8: 100 },
            { DataHora: "2025-08-28T11:00:00", LC_3_8: 120 },
            { DataHora: "2025-08-28T12:00:00", LC_3_8: 160 },
            { DataHora: "2025-08-28T13:00:00", LC_3_8: 190 }
          ];
        }

        console.log("📊 Serie final usada:", serie);
        console.log("⚖️ MassaTon usada:", massaTon);

        criarGraficoTaxaHoraAHora("graficoTaxa", serie, massaTon);

        // Mostrar botão exportar PDF se deu certo
        document.getElementById("btnExportarPDF").style.display = "block";
      } catch (e) {
        console.error("❌ Erro no fetch:", e);
      }
    }

    function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon) {
      console.log("🚀 Iniciando criarGraficoTaxaHoraAHora...");
      console.log("dadosSerie recebido:", dadosSerie);
      console.log("massaTon recebido:", massaTon);

      if (!massaTon || massaTon <= 0) {
        console.warn("⚠️ massaTon inválido:", massaTon);
        return;
      }

      const canvas = document.getElementById(idCanvas);
      if (!canvas) {
        console.warn(`⚠️ Canvas com id '${idCanvas}' não encontrado.`);
        return;
      }
      console.log("✅ Canvas encontrado:", canvas);

      const ctx = canvas.getContext("2d");

      // destruir gráfico anterior se já existir
      if (graficoTaxa) {
        console.log("🗑️ Destruindo gráfico anterior...");
        graficoTaxa.destroy();
      }

      const dadosPorHora = {};
      dadosSerie.forEach(linha => {
        const dataHora = new Date(linha.DataHora);
        if (isNaN(dataHora)) {
          console.warn("⚠️ Data inválida encontrada:", linha.DataHora);
          return;
        }
        dataHora.setMinutes(0, 0, 0);
        const chaveHora = dataHora.getTime();
        const valorLC = parseFloat(linha.LC_3_8);
        if (isNaN(valorLC)) {
          console.warn("⚠️ Valor LC inválido:", linha.LC_3_8);
          return;
        }
        if (!dadosPorHora[chaveHora]) dadosPorHora[chaveHora] = [];
        dadosPorHora[chaveHora].push(valorLC);
      });

      console.log("📊 dadosPorHora agrupados:", dadosPorHora);

      const chavesOrdenadas = Object.keys(dadosPorHora).sort((a, b) => a - b);

      const labelsHoras = [];
      const taxasHoraAHora = [];
      let valorAnterior = null;

      chavesOrdenadas.forEach(chave => {
        const hora = new Date(Number(chave)).getHours();
        labelsHoras.push(`${hora}h`);
        const valores = dadosPorHora[chave];
        const valorAtual = valores[valores.length - 1];
        if (valorAnterior !== null) {
          taxasHoraAHora.push((valorAtual - valorAnterior) / massaTon);
        } else {
          taxasHoraAHora.push(0);
        }
        valorAnterior = valorAtual;
      });

      console.log("🕒 Labels finais:", labelsHoras);
      console.log("📈 Taxas calculadas:", taxasHoraAHora);

      if (labelsHoras.length === 0 || taxasHoraAHora.length === 0) {
        console.warn("⚠️ Sem dados suficientes para plotar o gráfico.");
        return;
      }

      graficoTaxa = new Chart(ctx, {
        type: "line",
        data: {
          labels: labelsHoras,
          datasets: [{
            label: "Taxa LC L/(h*t)",
            data: taxasHoraAHora,
            borderColor: "blue",
            backgroundColor: "rgba(52,152,219,0.2)",
            fill: true,
            tension: 0.2,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: "top" },
            title: {
              display: true,
              text: "Taxa LC por Hora"
            }
          },
          scales: {
            y: {
              title: { display: true, text: "Taxa LC L/(h*t)" }
            },
            x: {
              title: { display: true, text: "Hora" }
            }
          }
        }
      });

      console.log("✅ Gráfico criado com sucesso!");
    }
  </script>
</body>
</html>
