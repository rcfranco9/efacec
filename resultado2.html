<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Consulta Transformador - Base de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 20px;
  background: #f0f2f5;
  color: #333;
}

h2 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 20px;
}

input, button {
  padding: 8px 12px;
  margin: 5px 5px 20px 0;
  border-radius: 4px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background-color: #3498db;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #2980b9;
}

.bloco-transformador {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.bloco-transformador:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

h3 {
  margin-bottom: 10px;
  color: #2c3e50;
}

h4 {
  margin-top: 15px;
  color: #34495e;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}

p, li {
  margin: 3px 0;
  font-size: 14px;
}

ul {
  padding-left: 20px;
}

table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background-color: #3498db;
  color: white;
}

canvas {
  margin-top: 15px;
  border-radius: 8px;
  background: #f7f9fc;
  padding: 10px;
}

#btnExportarPDF {
  display: block;
  background-color: #27ae60;
  margin: 0 auto 30px auto;
}

#btnExportarPDF:hover {
  background-color: #1e8449;
}
</style>
</head>
<body>

<h2>Consulta Transformador (Base: meubanco)</h2>

<input type="text" id="nomeInput" placeholder="Digite o nome do transformador">
<button id="btnBuscar">Buscar</button>
<div id="resultado"></div>
<button id="btnExportarPDF" style="display:none;">Exportar PDF</button>

<script>
function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf), r = parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  if(r>=p+5) return '100%';
  if(r<=p-5) return '0%';
  if(r===p) return '50%';
  let ind=50+((r-p)*10);
  if(ind<0) ind=0;
  if(ind>100) ind=100;
  return `${Math.round(ind)}%`;
}

function calculaIndicePressao(pf, rf){
  const p=parseFloat(pf), r=parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  const diff=r-p;
  if(diff>=5) return '0%';
  if(diff<=-5) return '100%';
  if(diff===0) return '50%';
  const prop=(5-diff)/10;
  return `${Math.round(prop*100)}%`;
}

function formatarData(d){
  const dia = String(d.getDate()).padStart(2,'0');
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

let encontradosGlobais=[];

document.getElementById('btnBuscar').addEventListener('click', buscarPorNome);

async function buscarPorNome(){
  const nome=document.getElementById('nomeInput').value.trim();
  const out=document.getElementById('resultado');
  if(!nome){ out.textContent='Por favor, insere o nome do transformador.'; return; }
  out.textContent='Buscando dados...';

  try{
    const res=await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
    if(!res.ok) throw new Error('Erro ao consultar a base de dados.');
    const data=await res.json();
    if(!data.length){ out.textContent='Transformador não encontrado.'; return; }

    encontradosGlobais=data;
    let html=`<h2>Resultados para: <strong>${nome}</strong></h2>`;

    data.forEach((item, index) => {
      const meta = item.meta;
      const serie = item.serie.filter(l => l.LC_3_8 !== undefined && l.DataHora);
      const referencia = item.referencia || [];
      const massaiTon = Number(meta.massai)/1000 || 0;

      const maxTE = Math.max(...serie.map(l=>parseFloat(l.TE)||0));
      const minPE_5_5_1 = Math.min(...serie.map(l=>parseFloat(l.PE_5_5_1)||Infinity));
      const minPE_4_17 = Math.min(...serie.map(l=>parseFloat(l.PE_4_17)||Infinity));

      let primeiraHoraPressaoBaixa = null;
      const serieOrdenada = serie.slice().sort((a,b)=>new Date(a.DataHora)-new Date(b.DataHora));
      for(const linha of serieOrdenada){
        const pressao = parseFloat(linha.PE_5_5_1);
        if(!isNaN(pressao) && pressao < 20){
          primeiraHoraPressaoBaixa = new Date(linha.DataHora);
          break;
        }
      }

      html += `<div class="bloco-transformador">
        <h3>#${index+1} — ID: ${meta.id_secagenscore}</h3>
        <p><strong>Temp. máx. sondas:</strong> ${formatNum(maxTE,2)} ºC</p>
        <p><strong>Pressão mínima:</strong> ${formatNum(minPE_5_5_1,3)} mbar</p>
        <p><strong>Vácuo fino mín.:</strong> ${formatNum(minPE_4_17,3)} mbar</p>
        <p><strong>Primeira hora com pressão PE_5_5_1 abaixo de 20 mbar:</strong> ${primeiraHoraPressaoBaixa ? formatarData(primeiraHoraPressaoBaixa) : 'N/A'}</p>`;

      if(primeiraHoraPressaoBaixa && referencia.length){
        let dataAnterior = primeiraHoraPressaoBaixa;
        for(let faseNum=1; faseNum<=6; faseNum++){
          const aquecKey = `RF${faseNum}TAquec`;
          const remKey = `RF${faseNum}DRem`;
          const tempoAquec = parseFloat(referencia[0][aquecKey]);
          const tempoRem = parseFloat(referencia[0][remKey]);
          const aquecValido = !isNaN(tempoAquec) && tempoAquec>0;
          const remValido = !isNaN(tempoRem) && tempoRem>0;

          if(aquecValido && remValido){
            const fimAquec = new Date(dataAnterior.getTime() + tempoAquec*3600000);
            const inicioRem = fimAquec;
            const fimRem = new Date(inicioRem.getTime() + tempoRem*3600000);
            html += `<p><strong>Início da zona de remoção RF${faseNum}DRem:</strong> ${formatarData(inicioRem)}</p>`;
            html += `<p><strong>Fim da zona de remoção RF${faseNum}DRem:</strong> ${formatarData(fimRem)}</p>`;
            dataAnterior = fimRem;
          } else {
            html += `<p><strong>A secagem não chegou à fase RF${faseNum}DRem.</strong></p>`;
            break;
          }
        }
      } else {
        html += `<p><strong>A série de referência não está disponível ou pressão nunca < 20 mbar.</strong></p>`;
      }

      // Taxas últimas 18h
      const taxas3h=[];
      if(serie.length>=2){
        const datas=serie.map(l=>new Date(l.DataHora)).sort((a,b)=>a-b);
        const final=datas[datas.length-1];
        for(let i=0;i<6;i++){
          const h1=new Date(final.getTime()- (i+1)*3*3600000);
          const h2=new Date(final.getTime()- i*3*3600000);
          const blocos=serie.filter(l=>{ const d=new Date(l.DataHora); return d>=h1 && d<=h2; });
          if(blocos.length>=2){
            const dif=blocos[blocos.length-1].LC_3_8-blocos[0].LC_3_8;
            taxas3h.unshift(dif/massaiTon);
          } else taxas3h.unshift(0);
        }
      }

      html += `<h4>Taxas de remoção (últimas 18h em blocos de 3h)</h4><ul>`;
      for(let i=0;i<6;i++){
        html += `<li>${i*3}h - ${(i+1)*3}h atrás: ${formatNum(taxas3h[i]||0)} L/(h*t)</li>`;
      }
      html += `</ul>`;

      // Gráficos
      html += `<canvas id="graficoTaxa${index}" width="600" height="300"></canvas>`;
      html += `<canvas id="graficoPF_RF${index}" width="600" height="300"></canvas>`;
      html += `<canvas id="graficoLC${index}" width="600" height="300"></canvas>`;
      html += `</div>`;

      setTimeout(()=>{
        criarGraficoTaxaHoraAHora('graficoTaxa'+index, serie, massaiTon, index);
        criarGraficoPF_RF('graficoPF_RF'+index, referencia, index);
        criarGraficoLC('graficoLC'+index, serie, index);
      },100);

    });

    out.innerHTML=html;
    document.getElementById('btnExportarPDF').style.display='block';

  }catch(e){
    console.error(e);
    out.innerHTML=`<p><strong>Erro ao buscar dados do transformador:</strong> ${e.message}</p>`;
  }
}

// --- Gráficos ---
function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, massaTon){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!dadosSerie.length) return;
  const labels=dadosSerie.map(l=>l.DataHora);
  const valores=dadosSerie.map(l=>parseFloat(l.LC_3_8)/massaTon || 0);
  new Chart(ctx,{type:'line',data:{labels, datasets:[{label:'Taxa LC L/(h*t)', data:valores, borderColor:'blue', fill:false}]}, options:{responsive:true}});
}

function criarGraficoPF_RF(idCanvas, referencia){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!referencia.length) return;
  const labels=['PF1','PF2','PF3','PF4','PF5','PF6'];
  const pf=labels.map(l=>referencia[0][l+'TAquec']||0);
  const rf=labels.map(l=>referencia[0][l.replace('PF','RF')+'TAquec']||0);
  new Chart(ctx,{type:'bar',data:{labels, datasets:[{label:'PF', data:pf, backgroundColor:'rgba(52,152,219,0.7)'},{label:'RF', data:rf, backgroundColor:'rgba(231,76,60,0.7)'}]}});
}

function criarGraficoLC(idCanvas, serie){
  const ctx=document.getElementById(idCanvas);
  if(!ctx||!serie.length) return;
  const labels=serie.map(l=>l.DataHora);
  const valores=serie.map(l=>l.LC_3_8||0);
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'LC_3_8', data:valores, borderColor:'green', fill:false}]}, options:{responsive:true}});
}

// --- PDF Export ---
document.getElementById('btnExportarPDF').addEventListener('click',()=>{
  html2canvas(document.body).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const imgProps=pdf.getImageProperties(imgData);
    const pdfWidth=210;
    const pdfHeight=(imgProps.height * pdfWidth)/imgProps.width;
    pdf.addImage(imgData,'PNG',0,0,pdfWidth,pdfHeight);
    pdf.save('transformador.pdf');
  });
});
</script>

</body>
</html>
