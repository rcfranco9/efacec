<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Consulta Transformador - Base de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 1000px;
  margin: 20px auto;
  padding: 20px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}
h1, h2, h3 { text-align: center; color: #2c3e50; }
input, button {
  padding: 10px 15px;
  margin: 5px 5px 20px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}
button {
  background-color: #3498db;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background-color: #2980b9; }
.bloco {
  background: #f7f9fc;
  padding: 15px 20px;
  margin-bottom: 30px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}
.bloco h3 { margin-top: 0; color: #34495e; }
.bloco p { margin: 3px 0; font-size: 14px; }
canvas { display: block; margin: 20px auto; border-radius: 8px; background: #fff; padding: 10px; }
#btnExportarPDF { display: block; background-color: #27ae60; margin: 0 auto 30px auto; }
#btnExportarPDF:hover { background-color: #1e8449; }
</style>
</head>
<body>

<div class="container">
<h1>Consulta Transformador</h1>

<div style="text-align:center; margin-bottom:20px;">
<input type="text" id="nomeInput" placeholder="Digite o nome do transformador">
<button id="btnBuscar">Buscar</button>
</div>

<div id="resultado"></div>

<button id="btnExportarPDF" style="display:none;">Exportar PDF</button>
</div>

<script>
let graficos = [];

function formatNum(v, dec = 3) {
  const n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0';
  return parseFloat(n.toFixed(dec)).toString();
}

function calcularIndice(pf, rf) {
  const p = parseFloat(pf), r = parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  if(r>=p+5) return '100%';
  if(r<=p-5) return '0%';
  if(r===p) return '50%';
  let ind=50+((r-p)*10);
  if(ind<0) ind=0;
  if(ind>100) ind=100;
  return `${Math.round(ind)}%`;
}

function calculaIndicePressao(pf, rf){
  const p=parseFloat(pf), r=parseFloat(rf);
  if(isNaN(p)||isNaN(r)) return 'N/A';
  const diff=r-p;
  if(diff>=5) return '0%';
  if(diff<=-5) return '100%';
  if(diff===0) return '50%';
  const prop=(5-diff)/10;
  return `${Math.round(prop*100)}%`;
}

function formatarData(d){
  if(!d) return 'N/A';
  const dia = String(d.getDate()).padStart(2,'0');
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

document.getElementById('btnBuscar').addEventListener('click', buscarPorNome);

async function buscarPorNome() {
  const nome = document.getElementById('nomeInput').value.trim();
  const out = document.getElementById('resultado');
  if (!nome) { 
    out.textContent = 'Por favor, insira o nome do transformador.'; 
    return; 
  }
  out.textContent = 'Buscando dados...';
  graficos.forEach(g => g.destroy());
  graficos = [];
  out.innerHTML = '';

  try {
    const res = await fetch(`/api/transformador?nome=${encodeURIComponent(nome)}`);
    if (!res.ok) throw new Error('Erro ao consultar a base de dados.');
    const data = await res.json();
    console.log("📦 Dados recebidos da API:", data);

    if (!data.length) { 
      out.textContent = 'Transformador não encontrado.'; 
      return; 
    }

  data.forEach((t, index) => {
  const serieRef = t.referencia || [{}];
  const meta = t.meta || {};
  const serie = t.serie || [];

  let massaTon = parseFloat(meta.massat)/1000;
  if (isNaN(massaTon)) massaTon = 100;

  let duracao = parseFloat(meta.duracao) || 0;
  let aguaRemovida = parseFloat(meta.aguaRemovida) || 0;
  let massaIsolantesTon = parseFloat(meta.massai)/1000;
  if(isNaN(massaIsolantesTon) || massaIsolantesTon <= 0) massaIsolantesTon = 1;
  let taxaTotal = duracao > 0 ? aguaRemovida / (duracao * massaIsolantesTon) : 0;

  // Criar bloco principal
  const bloco = document.createElement('div');
  bloco.classList.add('bloco');

  // Metadados
  bloco.innerHTML = `
    <h3>Transformador #${index+1} - ID: ${meta.id_secagenscore || 'N/A'}</h3>
    <table style="width:100%; border-collapse: collapse; margin-bottom:15px;">
      <tr><td><strong>Potência</strong></td><td>${meta.potencia || 0} kVA</td></tr>
      <tr><td><strong>Tensão</strong></td><td>${meta.tensao || 0} kV</td></tr>
      <tr><td><strong>Massa transformador</strong></td><td>${meta.massat || 0} kg</td></tr>
      <tr><td><strong>Massa isolantes</strong></td><td>${meta.massai || 0} t</td></tr>
      <tr><td><strong>Duração total</strong></td><td>${duracao.toFixed(2)} h</td></tr>
      <tr><td><strong>Água removida</strong></td><td>${aguaRemovida.toFixed(2)} L</td></tr>
      <tr><td><strong>Taxa total</strong></td><td>${taxaTotal.toFixed(3)} L/(h*t)</td></tr>
    </table>
  `;

  // Índices PF/RF e Pressão em tabela
  if(serieRef[0]){
    let tabelaIndices = `
      <h4>Índices PF/RF e Pressão</h4>
      <table style="width:100%; border-collapse: collapse; margin-bottom:15px;" border="1">
        <tr style="background:#2980b9; color:white;">
          <th>Fase</th>
          <th>TAquec PF</th>
          <th>TAquec RF</th>
          <th>Índice</th>
          <th>PRem PF</th>
          <th>PRem RF</th>
          <th>Índice Pressão</th>
        </tr>
    `;
    for(let fase=1; fase<=6; fase++){
      const pf = serieRef[0][`PF${fase}TAquec`] || 0;
      const rf = serieRef[0][`RF${fase}TAquec`] || 0;
      const pfp = serieRef[0][`PF${fase}PRem`] || 0;
      const rfp = serieRef[0][`RF${fase}PRem`] || 0;
      tabelaIndices += `
        <tr>
          <td>${fase}</td>
          <td>${pf}</td>
          <td>${rf}</td>
          <td>${calcularIndice(pf,rf)}</td>
          <td>${pfp}</td>
          <td>${rfp}</td>
          <td>${calculaIndicePressao(pfp,rfp)}</td>
        </tr>
      `;
    }
    tabelaIndices += `</table>`;
    bloco.innerHTML += tabelaIndices;
  }

  // Fases de Secagem
  bloco.innerHTML += `<h4>Fases de Secagem</h4>`;
  const serieOrdenada = serie.slice().sort((a,b)=>new Date(a.DataHora)-new Date(b.DataHora));
  let primeiraHoraPressaoBaixa = null;
  for(const l of serieOrdenada){
    const p = parseFloat(l.PE_5_5_1);
    if(!isNaN(p) && p<20){ primeiraHoraPressaoBaixa=new Date(l.DataHora); break; }
  }
  bloco.innerHTML += `<p><strong>Primeira hora com PE_5_5_1 abaixo de 20 mbar:</strong> ${formatarData(primeiraHoraPressaoBaixa)}</p>`;

  let dataAnterior = primeiraHoraPressaoBaixa || new Date();
  let tabelaFases = `
    <table style="width:100%; border-collapse: collapse; margin-bottom:15px;" border="1">
      <tr style="background:#27ae60; color:white;"><th>Fase</th><th>Início</th><th>Fim</th></tr>
  `;
  for(let fase=1; fase<=6; fase++){
    const aquec = parseFloat(serieRef[0][`RF${fase}DAquec`]);
    const rem = parseFloat(serieRef[0][`RF${fase}DRem`]);
    if(aquec>0 && rem>0){
      const inicioRem = new Date(dataAnterior.getTime() + aquec*3600000);
      const fimRem = new Date(inicioRem.getTime() + rem*3600000);
      tabelaFases += `<tr><td>${fase}</td><td>${formatarData(inicioRem)}</td><td>${formatarData(fimRem)}</td></tr>`;
      dataAnterior = fimRem;
    } else {
      tabelaFases += `<tr><td colspan="3">A secagem não chegou à fase RF${fase}DRem.</td></tr>`;
      break;
    }
  }
  tabelaFases += `</table>`;
  bloco.innerHTML += tabelaFases;

  // Canvas para gráfico
  const canvas = document.createElement('canvas');
  const canvasId = `graficoTaxa_${index}`;
  canvas.id = canvasId;
  canvas.width = 800;
  canvas.height = 350;
  bloco.appendChild(canvas);

  out.appendChild(bloco);

  // Criar gráfico
  const g = criarGraficoTaxaHoraAHora(canvasId, serie, meta);
  graficos.push(g);
});


    document.getElementById('btnExportarPDF').style.display='block';
  } catch(err) {
    console.error(err);
    out.textContent = 'Erro ao buscar os dados.';
  }
}

function criarGraficoTaxaHoraAHora(idCanvas, dadosSerie, meta) {
  if(!dadosSerie || dadosSerie.length===0) return null;
  let massaIsolantesTon = parseFloat(meta.massai)/1000;
  if(isNaN(massaIsolantesTon) || massaIsolantesTon<=0) massaIsolantesTon=1;

  const dadosPorHora = {};
  dadosSerie.forEach(linha=>{
    const dataHora=new Date(linha.DataHora);
    if(isNaN(dataHora)) return;
    dataHora.setMinutes(0,0,0);
    const chaveHora = dataHora.getTime();
    const valorLC = parseFloat(linha.LC_3_8);
    if(isNaN(valorLC)) return;
    if(!dadosPorHora[chaveHora]) dadosPorHora[chaveHora]=[];
    dadosPorHora[chaveHora].push(valorLC);
  });

  const chavesOrdenadas = Object.keys(dadosPorHora).sort((a,b)=>a-b);
  const labelsHoras = [];
  const taxasHoraAHora = [];
  let valorAnterior = null;

  chavesOrdenadas.forEach(chave=>{
    const hora = new Date(Number(chave)).getHours()+1;
    labelsHoras.push(`${hora}h`);
    const valores=dadosPorHora[chave];
    const valorAtual=valores[valores.length-1];
    const taxaHora = valorAnterior !== null ? (valorAtual - valorAnterior) / massaIsolantesTon : 0;
    taxasHoraAHora.push(parseFloat(taxaHora.toFixed(3)));
    valorAnterior=valorAtual;
  });

  const ctx = document.getElementById(idCanvas);
  if(!ctx) return null;

  const chart = new Chart(ctx,{
    type:'line',
    data:{
      labels: labelsHoras,
      datasets:[{
        label:'Taxa LC L/(h*t)',
        data: taxasHoraAHora,
        borderColor:'blue',
        backgroundColor:'rgba(52,152,219,0.2)',
        fill:true,
        tension:0.2,
        pointRadius:4
      }]
    },
    options:{
      responsive:true,
      plugins:{ legend:{ position:'top' }, title:{ display:true, text:'Taxa LC por Hora' } },
      scales:{ y:{ title:{ display:true, text:'Taxa LC L/(h*t)' } }, x:{ title:{ display:true, text:'Hora' } } }
    }
  });

  return chart;
}

// Exportar PDF
// Exportar PDF melhorado
document.getElementById('btnExportarPDF').addEventListener('click', async () => {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = pdf.internal.pageSize.getHeight();
  const resultado = document.getElementById('resultado');

  // Clonar o resultado
  const clone = resultado.cloneNode(true);
  document.body.appendChild(clone);

  // Substituir cada canvas por uma imagem
  const canvases = clone.querySelectorAll('canvas');
  canvases.forEach(c => {
    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.style.width = c.style.width || '100%';
    img.style.height = c.style.height || 'auto';
    c.parentNode.replaceChild(img, c);
  });

  // Capturar o clone inteiro
  await html2canvas(clone, { scale: 2, useCORS: true }).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const imgHeight = (canvas.height * pdfWidth) / canvas.width;

    if (imgHeight <= pdfHeight) {
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
    } else {
      // Paginação automática
      let heightLeft = imgHeight;
      let position = 0;
      while (heightLeft > 0) {
        pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight);
        heightLeft -= pdfHeight;
        position -= pdfHeight;
        if (heightLeft > 0) pdf.addPage();
      }
    }
  });

  // Limpar clone
  document.body.removeChild(clone);
  pdf.save('transformador.pdf');
});

</script>
</body>
</html>
